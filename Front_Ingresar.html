<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control Vehicular</title>
    <link rel="stylesheet" href="iniciar_sesion.css">   
</head>  
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Sistema de control vehicular</h1>
            <img src="LogoQue.png">
        </header>

        <!-- Main Content -->
        <main>
            <!-- Left Section (Image and Map) -->
            <section class="left-section">
                <div class="image-container">
                    <img src="mapaqro.png" alt="Querétaro">

            <section class="right-section">
                <div class="form-container">
                    <h2>Ingresar</h2>
                    <form method="post" action="Acceso.php" enctype="multipart/form-data">
                        <div class="input-group">
                            <label for="username">Usuario</label>
                            <input type="text" id="username" name = "username" placeholder="username" required>
                        </div>
                        <div class="input-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name = "password"placeholder="password" required>
                        </div>
                        <div class="input-group">
                            <label for="token">Token</label>
                            <input type="file" id="token" name="token" required>
                        </div>
                        <button type="submit" class="btn">Iniciar Sesión</button>
                    </form>
                    <p class="signup-text">
                        ¿Aún no tienes cuenta? <a href="FrontCrearCuenta.html">Crear cuenta</a>
                    </p>
                </div>
